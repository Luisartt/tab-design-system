<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TAB · LinkedIn link image · Case study (1200×627)</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="_template.css">
<style>
  /* Motif D: duotone photo (grayscale + #0F75BC multiply) with a white diagonal cut */
  .artboard { --k: 2; --m: 56px; background: var(--blanco); }

  .photo-wrap { left: auto; right: 0; width: 700px; }

  /* White panel; its right edge ascends left-to-right (bottom 520 -> top 650) */
  .panel {
    position: absolute; left: 0; top: 0; bottom: 0; width: 650px;
    background: var(--blanco);
    clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
  }

  .content { position: absolute; left: var(--m); top: var(--m); bottom: 150px; width: 470px; display: flex; flex-direction: column; }
  .pill { align-self: flex-start; font-size: 20px; padding: 10px 24px; }
  .member {
    margin-top: 30px; font-family: var(--font-cuerpo); font-weight: 800; font-size: 22px; line-height: 1.3;
    letter-spacing: .03em; text-transform: uppercase; color: var(--azul-accion);
  }
  .title { margin-top: 18px; font-family: var(--font-cuerpo); font-weight: 800; font-size: 50px; line-height: 1.12; color: var(--marino-logo); }
  .rule { margin-top: 30px; }

  .logo-wrap { position: absolute; left: var(--m); bottom: 48px; }
  .logo-wrap .logo { width: 200px; }

  .artboard[data-variant="blue-pill"] .pill { background: var(--azul-accion); }
</style>
</head>
<body>
<main class="artboard" data-template="case-study-link" data-variant="navy-pill" style="width:1200px;height:627px">
  <div class="photo-wrap duotone">
    <img class="photo" data-photo="main" src="../photos/03-owner.jpg" alt="" style="object-position:58% 30%">
  </div>
  <div class="panel"></div>

  <div class="content" data-fit-box>
    <span class="pill" data-field="badge" data-label="Badge" data-max="20">TAB Case Study</span>
    <div class="member" data-field="member" data-label="Member | Company" data-max="44" data-help="Real name + company, e.g. Mike Mayo | Nanohmics. Get written consent first.">[Member Name] | [Company]</div>
    <h1 class="title" data-field="title" data-label="Title" data-max="60" data-fit="34">Leading smarter by learning to delegate</h1>
    <span class="rule"></span>
  </div>

  <div class="logo-wrap">
    <img class="logo" data-logo="color" src="../logos/tab-logo-color.svg" alt="TAB The Alternative Board">
  </div>
</main>

<script type="application/json" id="tab-meta">
{
  "name": "LinkedIn link image · Case study",
  "group": "LinkedIn",
  "size": [1200, 627],
  "motif": "D · Duotone + diagonal cut, E · Pill",
  "variants": { "navy-pill": "Marino badge", "blue-pill": "Azul Acción badge" },
  "photos": ["03-owner", "02-coaching", "04-strategy-workshop"],
  "rules": [
    "Case studies use the member's real name and company (credibility first) and need their written consent.",
    "Duotone is automatic: grayscale photo multiplied with Azul TAB #0F75BC. Don't add filters.",
    "Titles are outcome-focused and in sentence case (e.g. 'Leading smarter by learning to delegate').",
    "Keep the member's face on the photo side, clear of the white diagonal cut."
  ]
}
</script>
<script src="_template.js"></script>
</body>
</html>
