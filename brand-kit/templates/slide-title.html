<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TAB · Slide · Title (1920×1080)</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="_template.css">
<style>
  .artboard { --k: 2; --m: 120px; background: var(--marino-fondo); }

  .logo-wrap { position: absolute; left: var(--m); top: 96px; }
  .logo-wrap .logo { width: 290px; }

  /* photo variant: text stays inside the dense veil (right edge <= 45% = 864px) */
  .content { position: absolute; left: var(--m); top: 300px; bottom: 250px; width: 744px; display: flex; flex-direction: column; justify-content: flex-end; }
  .content .eyebrow { margin-bottom: 28px; }
  .content .display { font-size: 100px; line-height: 1.05; }
  .content .rule { margin: 48px 0 36px; background: var(--naranja); }
  .subtitle { font-family: var(--font-cuerpo); font-weight: 400; font-size: 36px; line-height: 1.45; color: var(--blanco); max-width: 744px; }

  .presenter { position: absolute; left: var(--m); bottom: 110px; width: 744px; display: flex; flex-direction: column; gap: 6px; }
  .presenter .name { font-family: var(--font-cuerpo); font-weight: 700; font-size: 30px; line-height: 1.3; color: var(--blanco); }
  .presenter .meta { font-family: var(--font-cuerpo); font-weight: 600; font-size: 26px; line-height: 1.3; color: var(--cielo); }

  /* navy variant: no photo; one S-curve band at the bottom (Marino Profundo + #1A60AD stroke) */
  .s-curve { display: none; color: var(--marino-profundo); }
  .artboard[data-variant="navy"] .photo-wrap, .artboard[data-variant="navy"] .veil { display: none; }
  .artboard[data-variant="navy"] .s-curve { display: block; }
  .artboard[data-variant="navy"] .content { width: 1240px; }
  .artboard[data-variant="navy"] .subtitle { max-width: 900px; }
  .artboard[data-variant="navy"] .presenter { bottom: 230px; }
  .artboard[data-variant="navy"] .content { top: 260px; bottom: 370px; }
</style>
</head>
<body>
<main class="artboard on-dark" data-template="slide-title" data-variant="photo" style="width:1920px;height:1080px">
  <div class="photo-wrap">
    <img class="photo" data-photo="main" src="../photos/05-taste-of-tab.jpg" alt="" style="object-position:60% 45%">
  </div>
  <div class="veil"></div>
  <svg class="s-curve" viewBox="0 0 1440 110" preserveAspectRatio="none" aria-hidden="true">
    <path class="curve-fill" fill="currentColor" d="M0,86 C420,132 900,-14 1440,52 L1440,110 L0,110 Z"/>
    <path class="curve-stroke" fill="none" stroke="#1A60AD" stroke-width="5" vector-effect="non-scaling-stroke" d="M0,86 C420,132 900,-14 1440,52"/>
  </svg>

  <div class="logo-wrap">
    <img class="logo" data-logo="white" src="../logos/tab-logo-white.svg" alt="TAB The Alternative Board">
  </div>

  <div class="content" data-fit-box>
    <div class="eyebrow" data-field="eyebrow" data-label="Eyebrow" data-max="32" data-optional>Member orientation</div>
    <h1 class="display" data-field="title" data-label="Title" data-max="60" data-fit="64">Get more from your TAB board</h1>
    <span class="rule"></span>
    <p class="subtitle" data-field="subtitle" data-label="Subtitle" data-max="100" data-optional data-fit="26">How a board meeting works, and how to prepare so you leave with clear next steps</p>
  </div>

  <div class="presenter">
    <div class="name" data-field="presenter" data-label="Presenter" data-max="48" data-optional>[Presenter name], [Title]</div>
    <div class="meta" data-field="meta" data-label="Date / location" data-max="48" data-optional>[Month Day, Year] · [City]</div>
  </div>
</main>

<script type="application/json" id="tab-meta">
{
  "name": "Slide · Title",
  "group": "Presentations",
  "size": [1920, 1080],
  "motif": "C · Photo veil, or A · S-curve (navy)",
  "variants": { "photo": "Photo with veil", "navy": "Marino + S-curve" },
  "photos": ["05-taste-of-tab", "01-peer-board", "04-strategy-workshop"],
  "rules": [
    "White type on the left over the veil; faces stay in the right half.",
    "Titles in sentence case, 60 characters max. No exclamation chains.",
    "White logo on dark and on the veil; never the color logo on dark.",
    "Replace every [bracketed] placeholder before presenting."
  ]
}
</script>
<script src="_template.js"></script>
</body>
</html>
